version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sweety_user
      POSTGRES_PASSWORD: sweety_pass
      POSTGRES_DB: sweety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety_user -d sweety_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sweety-server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://sweety_user:sweety_pass@db:5432/sweety_db
      JWT_SECRET: sweety_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node src/db/init.js && node src/index.js"

  # React Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sweety-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
